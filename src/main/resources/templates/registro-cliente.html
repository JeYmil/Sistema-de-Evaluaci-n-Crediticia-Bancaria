<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Crear cuenta de cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:620px">
    <div class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h3">Crear cuenta de cliente</h1>
        <p class="text-muted">Registra los datos que usarás para ingresar al portal y hacer seguimiento a tus solicitudes.</p>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/registro-cliente}" th:object="${registro}" method="post">
            <label class="form-label" for="nombre">Nombre completo</label><input id="nombre" class="form-control mb-2" th:field="*{nombre}" required/>
            <div class="text-danger small" th:errors="*{nombre}"></div>
            <label class="form-label" for="dni">DNI</label><input id="dni" class="form-control mb-2" th:field="*{dni}" inputmode="numeric" maxlength="8" required/>
            <div class="text-danger small" th:errors="*{dni}"></div>
            <label class="form-label" for="correo">Correo</label><input id="correo" class="form-control mb-2" type="email" th:field="*{correo}" required/>
            <div class="text-danger small" th:errors="*{correo}"></div>
            <label class="form-label" for="clave">Contraseña (mínimo 8 caracteres)</label><input id="clave" class="form-control mb-3" type="password" th:field="*{clave}" minlength="8" required/>
            <div class="text-danger small" th:errors="*{clave}"></div>
            <button class="btn btn-primary">Crear cuenta</button> <a class="btn btn-outline-secondary" th:href="@{/login}">Volver al acceso</a>
        </form>
    </div></div>
</main></body></html>
