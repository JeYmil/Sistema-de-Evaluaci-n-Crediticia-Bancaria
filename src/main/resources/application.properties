server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/crediticio_db
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
# Clave de demostraci\u00c3\u00b3n local. En otro entorno, definir CREDITICIO_JWT_SECRET con una clave privada de 32 bytes o m\u00c3\u00a1s.
app.jwt.secret=${CREDITICIO_JWT_SECRET:local-only-secret-crediticio-jwt-2026-replace-this-value}
app.jwt.issuer=crediticio-bancario
app.jwt.expiration-minutes=60
